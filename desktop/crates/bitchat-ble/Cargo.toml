[package]
name = "bitchat-ble"
description = "BitChat BLE link layer: Android-compatible GATT framing and btleplug central node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitchat-wire = { path = "../bitchat-wire" }
btleplug = "0.13"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uuid = "1"
